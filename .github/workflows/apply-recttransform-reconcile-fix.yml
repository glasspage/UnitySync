name: Apply RectTransform reconciliation fix

on:
  push:
    branches:
      - fix/recttransform-reconcile

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recttransform-reconcile
          fetch-depth: 0

      - name: Patch transform reconciliation
        run: echo '' | base64 -d > /tmp/patch.py && python3 /tmp/patch.py

      - name: Commit source-only fix
        run: git rm .github/workflows/apply-recttransform-reconcile-fix.yml && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add Editor/SceneSync/UnitySyncSceneSerializer.cs && git commit -m 'Reconcile Transform to RectTransform transitions' && git push origin HEAD:fix/recttransform-reconcile
